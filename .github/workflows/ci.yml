name: CareerLens CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend Verification & Quality Gate
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend Lint, Security & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: careerlens_user
          POSTGRES_PASSWORD: test_ci_password_123
          POSTGRES_DB: careerlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Ruff Lint Check
        run: |
          cd backend
          ruff check .

      - name: Ruff Code Formatting Check
        run: |
          cd backend
          ruff format --check .

      - name: Bandit Static Security Scan
        run: |
          cd backend
          bandit -r app alembic -ll

      - name: Initialize pgvector extension and enforce least privilege
        run: |
          PGPASSWORD=test_ci_password_123 psql -h localhost -U careerlens_user -d careerlens_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=test_ci_password_123 psql -h localhost -U careerlens_user -d careerlens_test -c "ALTER ROLE careerlens_user NOCREATEDB NOSUPERUSER NOCREATEROLE;"

      - name: Run Alembic Database Migrations
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://careerlens_user:test_ci_password_123@localhost:5432/careerlens_test
          TEST_DATABASE_URL: postgresql+asyncpg://careerlens_user:test_ci_password_123@localhost:5432/careerlens_test
          JWT_SECRET_KEY: test_ci_secret_key_minimum_32_characters_long_required
        run: |
          cd backend
          alembic upgrade head

      - name: Execute Pytest Suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://careerlens_user:test_ci_password_123@localhost:5432/careerlens_test
          TEST_DATABASE_URL: postgresql+asyncpg://careerlens_user:test_ci_password_123@localhost:5432/careerlens_test
          JWT_SECRET_KEY: test_ci_secret_key_minimum_32_characters_long_required
        run: |
          cd backend
          pytest -v

  # ---------------------------------------------------------------------------
  # 2. Frontend Verification & Build Gate
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend Lint, Type-Check, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend Oxlint
        run: |
          cd frontend
          npm run lint

      - name: TypeScript Type-Check
        run: |
          cd frontend
          npm run type-check

      - name: Frontend Vitest Suite
        run: |
          cd frontend
          npm test -- --run

      - name: Frontend Production Build
        run: |
          cd frontend
          npm run build

  # ---------------------------------------------------------------------------
  # 3. Container & Docker Compose Validation
  # ---------------------------------------------------------------------------
  docker-validation:
    name: Docker Build & Compose Config Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        env:
          JWT_SECRET_KEY: test_ci_secret_key_minimum_32_characters_long_required
        run: |
          docker compose config

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: careerlens-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: careerlens-frontend:test
